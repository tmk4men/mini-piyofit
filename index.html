    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- 起動に失敗したら 原因を 画面に出す（モジュールが 読めない端末でも 動くよう 素の script） -->
    <script>
      (function () {
        var errs = [];
        window.addEventListener("error", function (e) { errs.push(String(e.message || e)); });
        window.addEventListener("unhandledrejection", function (e) { errs.push(String(e.reason)); });
        setTimeout(function () {
          if (window.__miniReady) return;
          var d = document.createElement("pre");
          d.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:10px;background:#fff;color:#c00;font-size:11px;white-space:pre-wrap;border-radius:8px";
          d.textContent = "きどうできませんでした\n" + errs.join("\n") + "\n" + navigator.userAgent;
          document.body.appendChild(d);
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
